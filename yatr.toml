# yatr - https://github.com/cargopete/yatr

[env]
CARGO_TERM_COLOR = "always"

[tasks.fmt]
desc = "Format the tree"
run = ["cargo fmt"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted"
run = ["cargo fmt --check"]
sources = ["src/**/*.rs"]

[tasks.lint]
desc = "Clippy with warnings denied"
run = ["cargo clippy --all-targets -- -D warnings"]
sources = ["src/**", "Cargo.toml", "Cargo.lock"]

[tasks.test]
desc = "Hashing, signing and proof encoding, against the deployed contract's digest"
run = ["cargo test --locked"]
sources = ["src/**", "examples/**", "Cargo.toml", "Cargo.lock"]
watch = ["src/**"]

[tasks.forge-deps]
desc = "Fetch forge-std, the contracts' only dependency"
run = ["git submodule update --init --recursive"]
no_cache = true

# With ARBITRUM_SEPOLIA_RPC_URL set the fork suites read live chain state, so a replay proves nothing.
# Without it they skip, loudly.
[tasks.test-contracts]
desc = "Forge tests against the deployed RecurringCollector"
depends = ["forge-deps"]
cwd = "contracts"
run = ["forge test"]
no_cache = true

[tasks.ci]
desc = "fmt-check, lint, test, test-contracts"
depends = ["fmt-check", "lint", "test", "test-contracts"]
