[package]
name = "weaver"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Construct, sign and settle Direct Indexer Payment agreements on The Graph. The RCA hashing is checked against the deployed RecurringCollector rather than against an opinion."

[[bin]]
name = "weaver"
path = "src/main.rs"

[dependencies]
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
alloy-signer = "0.5"
alloy-signer-local = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
